<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HunterChat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  </style>
</head>
<body class="bg-[#0f172a] h-screen flex items-center justify-center p-4">

  <section id="chat" class="w-full max-w-md h-[85vh] bg-[#1e293b] rounded-2xl shadow-2xl border border-slate-700 flex flex-col overflow-hidden">
    
    <header class="bg-[#1e293b] p-4 border-b border-slate-700 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></div>
        <h1 class="text-white font-bold tracking-tight">HunterChat</h1>
        <span class="ml-auto text-slate-400 text-xs font-mono">v2.1</span>
      </div>
      <span id="user-tag" class="text-indigo-400 text-[10px] font-mono uppercase bg-indigo-500/10 px-2 py-1 rounded"></span>
    </header>

    <ul id="messages" class="flex-1 overflow-y-auto p-4 flex flex-col">
      </ul>

    <form id="form" class="p-4 bg-[#1e293b] border-t border-slate-700 flex gap-2">
      <input 
        type="text" id="input" placeholder="Escribe un mensaje..." autocomplete="off"
        class="flex-1 bg-[#0f172a] text-white border border-slate-600 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500 transition-all text-sm"
      />
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white w-10 h-10 rounded-xl flex items-center justify-center transition-transform active:scale-90">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
          <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
        </svg>
      </button>
    </form>
  </section>

  <script type="module">
    import { io } from "https://cdn.socket.io/4.8.3/socket.io.esm.min.js";

    document.addEventListener('DOMContentLoaded', () => {
      const messagesList = document.getElementById('messages');
      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const userTag = document.getElementById('user-tag');

      let lastDateLabel = null;
      let username = localStorage.getItem('username') || prompt('Tu nombre:') || 'Anónimo';
      localStorage.setItem('username', username);
      userTag.innerText = username;

      const socket = io();

      socket.on('connect', () => socket.emit('get history'));

      socket.on('load history', (history) => {
        messagesList.innerHTML = ''; 
        lastDateLabel = null;
        history.forEach(m => renderMessage(m.content, m.user, m.timestamp));
        scrollToBottom();
      });

      socket.on('chat message', (msg, id, user, timestamp) => {
        renderMessage(msg, user, timestamp);
        scrollToBottom();
      });

      function renderMessage(content, user, timestamp) {
        const isMyMessage = user === username;
        // Al recibir el ISO string con 'Z', new Date() lo convierte a tu hora local automáticamente
        const msgDate = timestamp ? new Date(timestamp) : new Date();
        
        const dateLabel = getDateLabel(msgDate);
        if (dateLabel !== lastDateLabel) {
          renderDateSeparator(dateLabel);
          lastDateLabel = dateLabel;
        }

        const time = msgDate.toLocaleTimeString(navigator.language, { 
          hour: '2-digit', 
          minute: '2-digit',
          hour12: true 
        });

        const item = `
          <li class="flex flex-col mb-4 ${isMyMessage ? 'items-end' : 'items-start'}">
            <div class="flex items-center gap-2 mb-1 px-1 ${isMyMessage ? 'flex-row-reverse' : ''}">
              <span class="text-[10px] font-bold text-slate-500">${isMyMessage ? 'Tú' : user}</span>
              <span class="text-[9px] text-slate-600">${time}</span>
            </div>
            <div class="max-w-[90%] px-3 py-2 rounded-2xl text-sm shadow-md ${
              isMyMessage ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-700 text-slate-100 rounded-tl-none'
            }">
              ${content}
            </div>
          </li>`;
        messagesList.insertAdjacentHTML('beforeend', item);
      }

      function renderDateSeparator(label) {
        const separator = `
          <div class="flex items-center my-6">
            <div class="flex-grow border-t border-slate-700/50"></div>
            <span class="mx-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">${label}</span>
            <div class="flex-grow border-t border-slate-700/50"></div>
          </div>`;
        messagesList.insertAdjacentHTML('beforeend', separator);
      }

      function getDateLabel(date) {
        const today = new Date();
        const yesterday = new Date();
        yesterday.setDate(today.getDate() - 1);

        if (date.toDateString() === today.toDateString()) return 'Hoy';
        if (date.toDateString() === yesterday.toDateString()) return 'Ayer';
        
        return date.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
      }

      const scrollToBottom = () => messagesList.scrollTop = messagesList.scrollHeight;

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value.trim()) {
          socket.emit('chat message', input.value, username);
          input.value = '';
        }
      });
    });
  </script>
</body>
</html>
